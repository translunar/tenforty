# Fast (native Python) suite on every push — no LibreOffice anywhere.
name: fast-suite
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-24.04
    # GitHub's standard public runners have 4 cores; the suite that takes ~11
    # min locally (-n 4 on 14 cores) exceeded 45 min there — the first run was
    # killed by this timeout at 45m while still emitting output.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poppler (pdftoppm/pdftotext for the emit ink/placement checks)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python -m pip install -e ".[dev]"
      - name: Pin the PDF stack to the fleet's versions (CLAUDE.md §5 — a fresh
          resolve installs newer versions whose field enumeration differs, failing
          template-anchor tests on unchanged code)
        run: python -m pip install pypdf==6.9.2 reportlab==5.0.0 pillow==12.3.0
      - name: Fast tier (documented command, CLAUDE.md standard 2)
        env:
          # The private PII denylist config is gitignored and can never exist
          # here; the scanner runs its public checks and says so loudly.
          TENFORTY_PII_PUBLIC_CHECKS_ONLY: "1"
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/ -m "not oracle" -q -n 4 --dist load
