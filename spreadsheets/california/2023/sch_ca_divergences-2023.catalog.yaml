# spreadsheets/california/2023/sch_ca_divergences-2023.catalog.yaml
# Divergences source-of-truth for the TY2023 Schedule CA input worksheet.
# PORTED from spreadsheets/california/2024/sch_ca_divergences-2024.catalog.yaml
# with TY2023 conformity-date adjustments (Plan-3 Phase-C Step 2), cross-checked
# against the FTB 2023 Personal Income Tax Booklet "What's New" (pdfs/california/
# 2023/booklet.pdf pp.5-8). Same schema as the 2024 catalog. Re-run
# scripts/build_sch_ca_fods.py after editing.
#
# pub1001_page citations are carried over from the 2024 edition (Pub 1001 2023
# ed. not in-repo); the SUBSTANCE of each retained row is unchanged for 2023.
#
# TY2023 deltas vs the 2024 catalog (all conformity-DATE, no structural change):
#   DROPPED (provisions that first take effect after TY2023):
#     - IDC for oil/gas wells disallowed post-1/1/2024 (§B 3)
#     - No CA percentage depletion post-1/1/2024 (§B 3)
#     - Enhanced Oil Recovery Credit §43 repealed for CA 1/1/2024 (§B 3)
#     - CA Wildfire Mitigation Financial Assistance 1/1/2024-1/1/2029 (§B 8z)
#     - 529->Roth IRA rollover (SECURE 2.0, distributions after 12/31/2023) (§B 8z)
#   ADJUSTED:
#     - NOL (§B 8a): removed the "CA suspension TY2024-2026 for AGI >= $1M" clause
#       (SB 167 suspension begins TY2024; TY2023 had no CA NOL suspension).
#     - SALT cap (Part II 5e): wording TY2024 -> TY2023 (federal flat $10k/$5k
#       pre-OBBBA cap identical in 2023; substance unchanged).
#
# Drop rules applied vs. the 190-row enumeration (inherited from 2024):
#   - Row 41 (Part I §B 1 state tax refund): sole §B 1 item; entire line omitted.
#   - Row 24 (Part I §A 5b Tier 1+2 RRB): auto-derived via named field; dropped.
#   - Row 32 (Part I §A 6 Social Security broadly): auto-derived; dropped.
#   - Row 99 (Part I §B 7 generic UI): auto-derived; dropped.
#   - Row 100 (Part I §B 7 PFL): auto-derived via named field; dropped.
# Multi-line enumeration rows are split into one catalog row per Sch CA line.

