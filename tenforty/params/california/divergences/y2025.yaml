# tenforty/params/california/divergences/y2025.yaml
# Runtime-loaded Schedule CA (540) federal-vs-CA divergence catalog for TY2025.
# Hand-authored from FTB Publication 1001 (2024 edition); there is no
# 2025-edition sourcing for these rows yet — TY2025 was authored off the 2024
# Pub 1001 and forward-adjusted for known 2025 law (e.g. the OBBBA SALT-cap
# row at Part II 5e). A later audit part will reconcile TY2025 against
# 2025-edition sources. Each row carries a stable `id` as its first key,
# added when the catalog was packaged; row order and all other field values
# are carried verbatim from the pre-packaging spreadsheets source.
#
# Drop rules applied vs. the 190-row enumeration:
#   - Row 41 (Part I §B 1 state tax refund): sole §B 1 item; entire line omitted.
#   - Row 24 (Part I §A 5b Tier 1+2 RRB): auto-derived via named field; dropped.
#   - Row 32 (Part I §A 6 Social Security broadly): auto-derived; dropped.
#   - Row 99 (Part I §B 7 generic UI): auto-derived; dropped.
#   - Row 100 (Part I §B 7 PFL): auto-derived via named field; dropped.
# Multi-line enumeration rows are split into one catalog row per Sch CA line.

