# Divergences source-of-truth for the TY2021 Schedule CA input worksheet.
# PORTED from spreadsheets/california/2023/sch_ca_divergences-2023.catalog.yaml
# with TY2021 conformity-date deltas, cross-checked against the FTB 2021
# Personal Income Tax Booklet "What's New / Differences between California and
# Federal Law" (pdfs/california/2021/booklet.pdf pp.4-8) and the 2021
# Schedule CA (540) instructions (pp.43-54). Same schema as the 2023 catalog.
#
# CA conformity date for TY2021 is the IRC as of January 1, 2015 (2021 booklet
# p.4) — identical to TY2023 — so the standing TCJA/SECURE/CARES nonconformity
# rows port unchanged. R&TC does not conform to ARPA (2021), CAA 2021, CARES,
# or SECURE (2021 booklet p.4).
#
# pub1001_page citations are carried from the 2023 edition (Pub 1001 2021 ed.
# not in-repo); the SUBSTANCE of each retained row is unchanged for 2021. Rows
# added/adjusted below cite the booklet/Sch CA page verified in-repo and flag
# their Pub 1001 page as unverified-in-repo.
#
# TY2021 deltas vs the 2023 base (conformity-DATE driven):
#   DROPPED (federal/CA provision not yet in effect for TY2021):
#     - R&E capitalization IRC §174 (§B 3): federal 5-yr mandate first applies
#       TY2022; TY2021 = current deduction, no divergence.
#     - Turf-replacement water-conservation exclusion (§B 8z, R&TC 17138.2):
#       first applies TY2022.
#     - Discharge of unpaid community-college fees (§B 8z, R&TC 17131.21):
#       first applies TY2022.
#     - CA HOPE for Children Trust Account (§B 8z, R&TC 17141.5): first
#       applies TY2023 (FTB 2023 booklet: "for taxable years beginning on or
#       after January 1, 2023"). CORRECTED reason per source-side review —
#       this catalog previously stated "first applies TY2022" (AB 156's
#       enactment year, not FTB's effective-date language); the TY2021 DROP
#       outcome was always right, but for the wrong reason. Also absent from
#       TY2022 (see that catalog's header) as well as TY2021.
#     - Interagency Council on Homelessness payment exclusion (§B 8z,
#       R&TC 17131.13): first applies TY2023 (FTB 2023 booklet, same "on or
#       after January 1, 2023" language). NOT in effect for TY2021 (or
#       TY2022); absent from the 2021 booklet, 2021 Pub 1001, and 2021 Sch CA
#       line-8z enumeration. ADDED in source-side review — originally ported
#       forward as an active row in error; row REMOVED.
#     - Guaranteed-income pilot payment exclusion (§B 8z, R&TC 17131.12): the
#       exclusion window opens 6/30/2022 and closes 7/1/2026 (FTB 2023
#       booklet); all of TY2021 precedes the window. NOT in effect for
#       TY2021; absent from the 2021 booklet, 2021 Pub 1001, and 2021 Sch CA
#       line-8z. ADDED in source-side review — originally ported forward as
#       an active row in error; row REMOVED. (KEPT for TY2022 — the window
#       opens inside that year; see the 2022 catalog.)
#     - Qualified wildfire relief payments (§B 8z): federal exclusion is from
#       the Federal Disaster Tax Relief Act of 2023 (enacted 12/2024), postdates
#       TY2021.
#   ADDED (TY2021-specific ARPA nonconformity):
#     - Employer dependent-care assistance $5,000->$10,500 ARPA increase
#       (§A 1e): CA conforms only to $5,000; excess added back. 2021-only.
#     - COBRA premium assistance subsidy (§B 8z): ARPA excluded it federally
#       (4/1-9/30/2021); CA includes. 2021-only.
#   ADJUSTED:
#     - NOL (§B 8a): TY2021 CA NOL suspension IS in effect for net business
#       income / modified AGI >= $1M (AB 85, TY2020-2022); carryover extended
#       one year (2021 booklet p.6, R&TC 17276.23).
#     - §529 (§B 8z): narrowed to the TCJA K-12 tuition expansion only; CA
#       conforms for TY2021+ to the FCAA-2020 apprenticeship/education-loan uses
#       (2021 booklet p.4).
#     - SALT cap (Part II 5e): wording TY2023 -> TY2021 (flat $10k/$5k TCJA cap
#       identical; substance unchanged).
#     - Wildfire-settlement retroactive-window rows (Kincade §17139.2, Zogg
#       §17139.3, Fire Victims Trust §17138.5, Thomas/Woolsey §17138.6): KEPT
#       for TY2021 (verified-defensible) but re-cited to the STATUTE'S OWN
#       retroactive effective window rather than a Pub 1001/booklet page,
#       since none of these four provisions appear in the 2021 booklet or
#       2021 Pub 1001 — their basis is the statute window, not a year-source
#       enumeration. See each row's pub1001_page/ircrtc below.
#
# Drops inherited from the 2023 base (auto-derived / enumeration) still apply:
#   Part I §B 7 generic UI + PFL (auto-derived named field — see the UI no-op
#   below); state tax refund §B 1; RRB §A 5b; SS §A 6.
#
# ── TY2021 documented no-ops (federal provisions with NO Schedule CA
#    adjustment — recorded EXPLICITLY, not left silently absent) ──
#   * 1040 line 12b non-itemizer charitable deduction ($300 / $600 MFJ,
#     CARES/CAA): a BELOW-AGI federal deduction. Schedule CA Part I adjusts
#     components of federal AGI (1040 line 11); Part II adjusts itemized
#     deductions. The line-12b deduction sits below AGI and outside CA's separate
#     standard/itemized-deduction computation, so it never enters Schedule CA.
#     NO adjustment row. (2021 booklet pp.4-8 list no line-12b divergence; the
#     2021 Sch CA has no line for it. Pub 1001 unverified-in-repo.)
#   * ARPA $10,200 unemployment-compensation exclusion: applies to TAXABLE
#     YEARS BEGINNING IN 2020 ONLY (IRC §85(c) as added by ARPA §9042); it does
#     NOT apply to TY2021. For TY2021 federal fully includes UI and CA fully
#     subtracts it — the 2021 Sch CA (540) Line 7 instruction directs entering
#     "the amount of unemployment compensation shown in column A" (the full
#     federal amount) with NO $10,200 modification. That full subtraction is
#     auto-derived by the compute's named field (same shape as the 2023 base,
#     which carries no manual UI row): NO manual UI divergence row and NO
#     shrinking-subtraction delta for TY2021. (2021 Sch CA instr. Line 7.)
#   * Advance / expanded Child Tax Credit (ARPA) and expanded federal EIC
#     (ARPA): federal tax CREDITS. Schedule CA carries neither; CA administers
#     its own YCTC/CalEITC (FTB 3514) off CA figures. NO Schedule CA row.
#     (2021 booklet p.2, p.6.)
#   * EIDL advance grant and PPP loan-forgiveness INCOME exclusions: CA CONFORMS
#     to the income exclusion (2021 booklet p.6; R&TC 17131.8 / AB 80) — no
#     income-side divergence. The PPP/SVOG expense-disallowance for "ineligible
#     entities" is retained as its own §B 3 rows.
#   * Restaurant Revitalization Grant (ARPA): grouped with PPP/EIDL/SVOG in the
#     2021 booklet reporting-requirements list (p.5); CA conforms to the income
#     exclusion. NO income-side divergence row.
#
# Multi-line enumeration rows are split into one catalog row per Sch CA line.

